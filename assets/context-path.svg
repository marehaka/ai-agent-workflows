<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1110" viewBox="0 0 960 1110" role="img" aria-labelledby="title desc">
<title id="title">From conversations to working context</title><desc id="desc">Original conversations remain the source. Recorder produces structured records. Derived search indexes support retrieval; people can inspect records and source references. Current task context also requires current requirements and human judgment. The diagram shows a path, not guaranteed automatic reuse.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#142033"/></marker></defs>
<rect width="960" height="1110" fill="#ffffff"/>
<text x="40" y="64" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#142033">Context for continuing work</text><text x="40" y="110" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#142033">Keep the source. Retrieve relevant background.</text><rect x="40" y="154" width="880" height="128" rx="16" fill="#fff0f1" stroke="none" stroke-width="2"/><rect x="40" y="154" width="8" height="128" rx="16" fill="#f04452" stroke="none" stroke-width="2"/><text x="68" y="196" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Original conversations</text><text x="68" y="238" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#142033">Raw JSONL • source material</text><path d="M480 288 L480 340" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><text x="510" y="322" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#142033">Recorder</text><rect x="40" y="350" width="880" height="158" rx="16" fill="#eef4ff" stroke="none" stroke-width="2"/><rect x="40" y="350" width="8" height="158" rx="16" fill="#2468f2" stroke="none" stroke-width="2"/><text x="68" y="398" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Structured records</text><text x="68" y="442" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#142033">Decisions, reasons, questions, and lessons</text><text x="68" y="481" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">References to the source • relationships between records</text><path d="M270 515 L270 567" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 515 L690 567" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="578" width="420" height="172" rx="16" fill="#eef4ff" stroke="none" stroke-width="2"/><text x="68" y="624" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#142033">Search index</text><text x="68" y="665" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">SQLite • derived from records</text><text x="68" y="708" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Retrieve relevant material</text><rect x="500" y="578" width="420" height="172" rx="16" fill="#fff8d5" stroke="none" stroke-width="2"/><text x="528" y="624" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142033">Human inspection</text><text x="528" y="665" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Records and source references</text><text x="528" y="708" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Review and make decisions</text><path d="M270 758 L270 823" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 758 L710 823" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="834" width="880" height="188" rx="16" fill="#142033" stroke="none" stroke-width="2"/><text x="68" y="880" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Context for the current task</text><text x="68" y="926" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#ffffff">Relevant past records + current requirements</text><text x="68" y="969" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#ffffff">Interpret what still applies, with human judgment</text><text x="40" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">A retrieval path, not a guarantee of automatic reuse.</text>
</svg>
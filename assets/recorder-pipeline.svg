<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1250" viewBox="0 0 960 1250" role="img" aria-labelledby="title desc">
<title id="title">Recorder processing stages</title><desc id="desc">Six stages: code normalizes input; an agent selects material; an agent writes records; code checks the output; an agent compares with existing records; code persists records and updates the index. Format checks are distinct from semantic correctness and downstream usefulness.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#142033"/></marker></defs>
<rect width="960" height="1250" fill="#ffffff"/>
<text x="40" y="64" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#142033">The Recorder pipeline</text><text x="40" y="110" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#142033">Separate interpretation from deterministic processing.</text><rect x="40" y="154" width="880" height="132" rx="16" fill="#eef4ff" stroke="none" stroke-width="2"/><rect x="40" y="154" width="8" height="132" rx="16" fill="#2468f2" stroke="none" stroke-width="2"/><text x="68" y="192" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2468f2">CODE</text><text x="68" y="229" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Normalize the source</text><text x="68" y="266" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Read the conversation into a consistent input.</text><path d="M480 293 L480 309" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="316" width="880" height="132" rx="16" fill="#fff0f1" stroke="none" stroke-width="2"/><rect x="40" y="316" width="8" height="132" rx="16" fill="#f04452" stroke="none" stroke-width="2"/><text x="68" y="354" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f04452">AGENT</text><text x="68" y="391" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Select useful material</text><text x="68" y="428" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Identify decisions, questions, lessons, and patterns.</text><path d="M480 455 L480 471" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="478" width="880" height="132" rx="16" fill="#fff0f1" stroke="none" stroke-width="2"/><rect x="40" y="478" width="8" height="132" rx="16" fill="#f04452" stroke="none" stroke-width="2"/><text x="68" y="516" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f04452">AGENT</text><text x="68" y="553" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Write the records</text><text x="68" y="590" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">State what happened and why, with source references.</text><path d="M480 617 L480 633" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="640" width="880" height="132" rx="16" fill="#eef4ff" stroke="none" stroke-width="2"/><rect x="40" y="640" width="8" height="132" rx="16" fill="#2468f2" stroke="none" stroke-width="2"/><text x="68" y="678" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2468f2">CODE</text><text x="68" y="715" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Check the output</text><text x="68" y="752" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Validate the required format and fields.</text><path d="M480 779 L480 795" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="802" width="880" height="132" rx="16" fill="#fff0f1" stroke="none" stroke-width="2"/><rect x="40" y="802" width="8" height="132" rx="16" fill="#f04452" stroke="none" stroke-width="2"/><text x="68" y="840" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f04452">AGENT</text><text x="68" y="877" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Compare and relate</text><text x="68" y="914" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Match existing records; identify relationships and changes.</text><path d="M480 941 L480 957" fill="none" stroke="#142033" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="964" width="880" height="132" rx="16" fill="#eef4ff" stroke="none" stroke-width="2"/><rect x="40" y="964" width="8" height="132" rx="16" fill="#2468f2" stroke="none" stroke-width="2"/><text x="68" y="1002" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2468f2">CODE</text><text x="68" y="1039" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#142033">Persist and ingest</text><text x="68" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Write derived records and update the search index.</text><text x="40" y="1178" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Checks on format do not prove semantic correctness.</text><text x="40" y="1215" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#142033">Retrieval and use in the next task need separate evaluation.</text>
</svg>